[model]
vocab_size = 10000
d_model = 512
num_layers = 4
num_heads = 16
d_ff = 1344
rope_theta = 10000.0

[training]
train_dataset_path = "datasets/tokenizer_10000/train.npy"
valid_dataset_path = "datasets/tokenizer_10000/valid.npy"
batch_size = 32
context_length = 256
num_steps = 5001
grad_norm_clip = 1.0
validation_every_num_steps = 50
snapshotting_every_num_steps = 50
snapshotting_path = "logs"

[optimizer]
lr = 3e-4
betas = [0.9, 0.999]
eps = 1e-8
weight_decay = 0.1
